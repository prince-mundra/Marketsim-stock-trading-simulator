name: marketsim

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - marketsim_mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { if (db.hello().isWritablePrimary) quit(0); } catch (e) {} try { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); } catch (e) {} quit(1);'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/stocksim?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: "3000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  marketsim_mongo_data:
